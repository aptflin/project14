name: Automated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete F1-F6 reports
        run: python -B -X utf8 run_tests.py
      - name: Run pytest including F5 and F6
        if: ${{ !cancelled() }}
        run: python -B -X utf8 -m pytest -v --junitxml=test-results/pytest.xml
      - name: Upload test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results/
          if-no-files-found: error
